<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการหอพัก</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#1e3a5f",
                        secondary: "#4a90d9",
                        accent: "#f59e0b"
                    },
                    fontFamily: {
                        sans: ["Sarabun", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="min-h-screen login-bg flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-primary rounded-full mx-auto flex items-center justify-center mb-4">
                <i data-lucide="building-2" class="w-10 h-10 text-white"></i>
            </div>
            <h1 id="loginTitle" class="text-2xl font-bold text-primary">ระบบบริหารจัดการหอพัก</h1>
            <p id="loginSubtitle" class="text-gray-500 mt-1">กรุณาเข้าสู่ระบบ</p>
        </div>

        <!-- เข้าสู่ระบบ -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="loginUser" class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                <input type="email" id="loginUser" autocomplete="username" required>
            </div>
            <div>
                <label for="loginPass" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
                <input type="password" id="loginPass" autocomplete="current-password" required>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-opacity-90">
                เข้าสู่ระบบ
            </button>
            <p id="loginError" class="hidden text-sm text-center text-red-600" role="alert"></p>
            <p class="text-sm text-center text-gray-500">
                ยังไม่มีบัญชี?
                <button type="button" id="showSignup" class="text-secondary font-semibold hover:underline">สมัครสมาชิก</button>
            </p>
        </form>

        <!-- สมัครสมาชิก -->
        <form id="signupForm" class="space-y-4 hidden">
            <div>
                <label for="signupEmail" class="block text-sm font-medium text-gray-700 mb-1">อีเมล</label>
                <input type="email" id="signupEmail" autocomplete="email" required>
            </div>
            <div>
                <label for="signupPass" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
                <input type="password" id="signupPass" autocomplete="new-password" minlength="8" required>
            </div>
            <div>
                <label for="signupPass2" class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่าน</label>
                <input type="password" id="signupPass2" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-opacity-90">
                สมัครสมาชิก
            </button>
            <p id="signupError" class="hidden text-sm text-center text-red-600" role="alert"></p>
            <p class="text-sm text-center text-gray-500">
                มีบัญชีอยู่แล้ว?
                <button type="button" id="showLogin" class="text-secondary font-semibold hover:underline">เข้าสู่ระบบ</button>
            </p>
        </form>

        <!-- สถานะบัญชี (รออนุมัติ / ไม่อนุมัติ) -->
        <div id="statusPanel" class="hidden text-center space-y-4">
            <h2 id="statusTitle" class="text-lg font-semibold text-primary"></h2>
            <p id="statusText" class="text-sm text-gray-600"></p>
            <button type="button" id="statusLogout" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-opacity-90">
                ออกจากระบบ
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="js/firebase.js"></script>
<script src="js/main.js"></script>
    <script src="js/login.js"></script>
    <script>
        if (window.lucide?.createIcons) lucide.createIcons();
    </script>
</body>
</html>
